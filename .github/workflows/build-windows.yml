name: Build Windows MSI

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - run: pnpm install --no-frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri app (with signing)
        shell: bash
        run: pnpm tauri build -- --no-default-features --features duckdb-sidecar,mq-admin
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json for internal update
        id: latest
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MSI=$(ls target/release/bundle/msi/*.msi | head -1)
          MSI_NAME=$(basename "$MSI")
          EXE=$(ls target/release/bundle/nsis/*.exe | head -1)
          EXE_NAME=$(basename "$EXE")

          MSI_SIG_FILE="${MSI}.sig"
          MSI_SIGNATURE=$( [ -f "$MSI_SIG_FILE" ] && cat "$MSI_SIG_FILE" || echo "" )

          EXE_SIG_FILE="${EXE}.sig"
          EXE_SIGNATURE=$( [ -f "$EXE_SIG_FILE" ] && cat "$EXE_SIG_FILE" || echo "" )

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > target/release/bundle/latest.json << JSONEOF
          {
            "version": "${VERSION}",
            "notes": "内网版本更新。\\n下载地址: \\n- MSI: http://25.75.3.1/dbx-drivers-v2/releases/latest/${MSI_NAME}\\n- EXE: http://25.75.3.1/dbx-drivers-v2/releases/latest/${EXE_NAME}",
            "pub_date": "${NOW}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${EXE_SIGNATURE}",
                "url": "http://25.75.3.1/dbx-drivers-v2/releases/latest/${EXE_NAME}"
              },
              "windows-x86_64-nsis": {
                "signature": "${EXE_SIGNATURE}",
                "url": "http://25.75.3.1/dbx-drivers-v2/releases/latest/${EXE_NAME}"
              },
              "windows-x86_64-msi": {
                "signature": "${MSI_SIGNATURE}",
                "url": "http://25.75.3.1/dbx-drivers-v2/releases/latest/${MSI_NAME}"
              }
            }
          }
          JSONEOF

          echo "msi_name=$MSI_NAME" >> $GITHUB_OUTPUT
          echo "exe_name=$EXE_NAME" >> $GITHUB_OUTPUT

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}-internal
          name: "DBX Internal v${{ steps.version.outputs.value }}"
          body: |
            Deploy to internal nginx v2. Copy .msi, .exe, and latest.json to releases/latest/ under /dbx-drivers-v2/.

            - Branch: `internal-build`
            - Upstream: v${{ steps.version.outputs.value }}
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/latest.json
