# DBX 内网文件服务器 nginx 配置
# 适用：老路径 /dbx-drivers/ + 新路径 /dbx-drivers-v2/ 并存
# 说明：两个路径在同一 root 下，nginx 配置无需为 v2 单独加 location。

server {
    listen 80;
    # 与老路径同一个 root（用户现场：/root/nginx_test/html/dbx_files 等）
    root /path/to/dbx_files;
    add_header Accept-Ranges bytes;
    gzip off;

    location / {
        autoindex on;
        try_files $uri =404;
    }
}
